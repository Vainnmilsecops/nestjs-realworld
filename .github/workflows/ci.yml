name: Backend checks
on:
  pull_request:
  push:
    branches: [main, feature/02-database-auth-redis]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U realworld -d realworld_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://realworld:realworld@127.0.0.1:5432/realworld_test
      TEST_DATABASE_URL: postgresql://realworld:realworld@127.0.0.1:5432/realworld_test
      REDIS_URL: redis://127.0.0.1:6379/1
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-only-secret-for-isolated-testing-minimum-32-characters
      AUTH_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run migration:run
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm run sunlint
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-evidence
          path: reports/
